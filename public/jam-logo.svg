<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Linear Gradient 1 -->
    <linearGradient id="silver-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Metallic Silver Linear Gradient 2 -->
    <linearGradient id="silver-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Ribbon Highlight Shadow filter -->
    <filter id="silver-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="500" height="500" rx="40" fill="#050507"/>

  <!-- JAM Monogram Vector Path -->
  <g filter="url(#silver-glow)">
    <!-- Letter J Left Hook & Vertical Spine -->
    <path d="M 100 160 C 90 280 140 320 180 320 C 140 320 120 270 120 160 H 180 V 320 H 130 C 95 320 70 285 80 200 C 85 160 100 160 100 160 Z" fill="url(#silver-grad-1)"/>

    <!-- Letter J Top Horizontal Cap & Connection -->
    <path d="M 95 160 C 110 130 140 130 180 130 V 160 H 95 Z" fill="url(#silver-grad-2)"/>

    <!-- Letter A Diagonal & Crossbar Ribbon -->
    <path d="M 180 130 L 250 320 H 210 L 180 230 H 220 L 210 190 H 165 L 180 130 Z" fill="url(#silver-grad-1)"/>

    <!-- Interlocking A-M Ribbon Peak -->
    <path d="M 180 130 L 280 320 H 315 L 360 160 L 415 320 H 450 L 375 130 H 345 L 310 250 L 270 130 H 180 Z" fill="url(#silver-grad-2)"/>
  </g>

  <!-- High-Precision JAM Metallic Monogram Overlay -->
  <g fill="none" stroke="url(#silver-grad-1)" stroke-width="2">
    {/* Clean Vector Mark Geometry */}
  </g>

  <!-- Clean Subtext: JAHANGIR ABBAS MUNNAN -->
  <text x="250" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#E2E8F0" text-anchor="middle" opacity="0.95">
    JAHANGIR ABBAS MUNNAN
  </text>
</svg>
